{% extends "base.html" %}
{% block content %}
<h1>Rebuttal —— 第 {{ round_number }} 轮</h1>
<p>Thread: {{ thread_id }}</p>
{% if locked %}
<p>已用完 2 轮 Rebuttal 机会。</p>
{% else %}
<form action="/rebuttal/{{ thread_id }}" method="post">
  <label>
    选择回应对象
  <select name="target">
    <option value="all">全部审稿人</option>
    {% for cfg in reviewers %}
    <option value="{{ cfg.role }}">{{ cfg.role }} —— {{ cfg.identity }}</option>
    {% endfor %}
    {% if not reviewers %}
    <option value="eic">EIC</option>
    <option value="methodology">Methodology</option>
    <option value="domain">Domain</option>
    <option value="perspective">Perspective</option>
    <option value="devils_advocate">Devils Advocate</option>
    {% endif %}
  </select>
  </label>
  <label>
    逐点回应
    <textarea name="text" rows="12" cols="80" placeholder="关于审稿人意见1：&#10;我们的实验设计已如正文 p.5 所述……" required></textarea>
  </label>
  <button type="submit">提交</button>
</form>
{% endif %}
<p><a href="/result/{{ thread_id }}">返回结果</a></p>
{% endblock %}
